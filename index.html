<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaliRide - E-Rickshaw Booking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b7a53;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 20px;
    }

    .booking-box {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .booking-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #0b7a53;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #095f41;
    }

    .info {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MaliRide 🛺</h1>
    <p>Easy E-Rickshaw Booking in Biratnagar</p>
  </header>

  <div class="container">
    <div class="booking-box">

      <h2>Book Your Ride</h2>

      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number">

      <label for="pickup">Pickup Location</label>
      <input type="text" id="pickup" placeholder="Where should we pick you up?">

      <label for="destination">Destination</label>
      <input type="text" id="destination" placeholder="Where are you going?">

      <button onclick="bookRide()">Book Ride</button>

      <p class="info">
        Our admin will contact you to confirm your ride and fare.
      </p>

    </div>
  </div>

  <footer>
    © 2026 MaliRide — Biratnagar
  </footer>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://mtblgpkirgwytiylenrg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fW5mkTBuEKJVXc7_3Olv4w_uRA5aQ90";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function bookRide() {

      async function bookRide() {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const pickup = document.getElementById("pickup").value.trim();
  const destination = document.getElementById("destination").value.trim();

  if (!name || !phone || !pickup || !destination) {
    alert("Please fill in all fields.");
    return;
  }

  const button = document.querySelector("button");

  button.disabled = true;
  button.innerText = "Booking...";

  try {

    const { data, error } = await supabaseClient
      .from("bookings")
      .insert([
        {
          passenger_name: name,
          passenger_phone: phone,
          pickup: pickup,
          destination: destination,
          status: "pending"
        }
      ]);

    if (error) {
      console.error("Booking error:", error);
      alert("Booking failed: " + error.message);
      return;
    }

    alert(
      "Booking request received! 🛺\n\n" +
      "Name: " + name + "\n" +
      "Pickup: " + pickup + "\n" +
      "Destination: " + destination
    );

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("pickup").value = "";
    document.getElementById("destination").value = "";

  } catch (err) {

    console.error("Unexpected error:", err);
    alert("Something went wrong. Please try again.");

  } finally {

    button.disabled = false;
    button.innerText = "Book Ride";

  }
}
